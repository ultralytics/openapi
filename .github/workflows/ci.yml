name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: ultralytics/actions/setup-uv@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SDKs
        run: |
          bun run generate
          git diff --exit-code -- generated

      - name: Check application
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bun run build

      - name: Check generated Python SDK
        run: |
          python -m compileall -q generated/python/src
          uv pip install --system ./generated/python
          python -c "from ultralytics_platform import AsyncPlatform, Platform"
          uvx ruff@0.16.2 check generated/python
