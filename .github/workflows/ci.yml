name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ultralytics/actions/setup-uv@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SDKs
        run: |
          bun run generate
          cp -R generated generated.first
          bun run generate
          diff --recursive generated.first generated

      - name: Check application
        run: |
          bun run typecheck
          bun run lint
          bun run knip
          bun run test
          bun run build

      - name: Check generated Python SDK
        run: |
          python -m compileall -q generated/python/src
          uv pip install --system ./generated/python
          python -c 'import importlib, json; c = json.load(open("openapi.config.json"))["python"]; m = importlib.import_module(c["package"]); getattr(m, c["client"]); getattr(m, "Async" + c["client"])'
          uvx ruff@0.16.2 check generated/python
