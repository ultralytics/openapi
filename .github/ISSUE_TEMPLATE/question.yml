name: ❓ Question
description: Ask about documentation or SDK generation
labels: [question]
body:
  - type: checkboxes
    attributes:
      label: Search before asking
      options:
        - label: I searched the [existing issues](https://github.com/ultralytics/openapi/issues) and [Ultralytics discussions](https://github.com/orgs/ultralytics/discussions).
          required: true

  - type: textarea
    attributes:
      label: Question
      description: Include the relevant operation, generated code, or OpenAPI fragment.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
