name: 🚀 Feature Request
description: Propose a focused documentation or SDK improvement
labels: [enhancement]
type: feature
body:
  - type: checkboxes
    attributes:
      label: Search before requesting
      options:
        - label: I searched the [existing issues](https://github.com/ultralytics/openapi/issues) and found no duplicate.
          required: true

  - type: dropdown
    attributes:
      label: Component
      options:
        - Interactive documentation
        - OpenAPI contract
        - Python SDK
        - New SDK language
        - Generator
        - CI or tooling
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposal
      description: Describe the smallest complete change and who would use it.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives
      description: Describe existing behavior or tools you considered.

  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request.
