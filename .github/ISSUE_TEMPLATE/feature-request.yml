name: 🚀 Feature Request
description: Suggest an Ultralytics Platform API documentation or SDK generation idea
# title: " "
labels: [enhancement]
type: "feature"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting an Ultralytics OpenAPI 🚀 Feature Request!

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please search the [Platform API reference](https://platform.ultralytics.com/api/docs) and [issues](https://github.com/ultralytics/openapi/issues) to see if a similar feature request already exists.
      options:
        - label: >
            I have searched the Ultralytics [issues](https://github.com/ultralytics/openapi/issues) and found no similar feature requests.
          required: true

  - type: dropdown
    attributes:
      label: OpenAPI Component
      description: |
        Please select the component your request applies to.
      multiple: true
      options:
        - "Interactive documentation"
        - "OpenAPI contract"
        - "Python SDK"
        - "New SDK language"
        - "Generator"
        - "CI or tooling"
        - "Other"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Description
      description: A short description of your feature.
      placeholder: |
        What new feature would you like to see in Ultralytics OpenAPI?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Use case
      description: |
        Describe the use case of your feature request. It will help us understand and prioritize the feature request.
      placeholder: |
        How would this feature be used, and who would use it?

  - type: textarea
    attributes:
      label: Additional
      description: Anything else you would like to share?

  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        (Optional) We encourage you to submit a [Pull Request](https://github.com/ultralytics/openapi/pulls) (PR) to help improve Ultralytics software for everyone, especially if you have a good understanding of how to implement a fix or feature.
        See the Ultralytics [Contributing Guide](https://docs.ultralytics.com/help/contributing) to get started.
      options:
        - label: Yes I'd like to help by submitting a PR!
