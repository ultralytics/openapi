name: 🐛 Bug Report
description: Report a documentation or SDK generation problem
labels: [bug, triage]
type: bug
body:
  - type: checkboxes
    attributes:
      label: Search before reporting
      options:
        - label: I searched the [existing issues](https://github.com/ultralytics/openapi/issues) and found no duplicate.
          required: true

  - type: dropdown
    attributes:
      label: Component
      options:
        - Interactive documentation
        - OpenAPI contract
        - Python SDK
        - Generator
        - CI or tooling
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug
      description: Describe what happened and what you expected. Include the relevant operation, output, or traceback.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest OpenAPI fragment or code sample that reproduces the problem.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Include operating system, Bun or Python version, and commit or package version.

  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request.
