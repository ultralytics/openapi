[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultralytics-platform"
version = "0.1.0"
description = "Python client for Ultralytics Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ultralytics_platform"]
